syntax = "proto3";

package gameap;

option go_package = "github.com/gameap/gameap/pkg/proto";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Path convention: the daemon resolves every filesystem path in this file
// inside the node work directory via os.Root. Leading separators and volume
// names are stripped, so absolute paths are reinterpreted as
// work-directory-relative rather than rejected. The single exception is
// CreateArchiveParams.sources, which resolves relative to base_path.

service FileTransferService {
  rpc UploadFile(stream UploadChunk) returns (UploadResult);
  rpc DownloadFile(DownloadRequest) returns (stream DownloadChunk);
  rpc FileOperation(FileOperationRequest) returns (FileOperationResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
}

message UploadChunk {
  UploadMetadata metadata = 1;
  bytes data = 2;
}

message UploadMetadata {
  string transfer_id = 1;
  string path = 2;
  int64 total_size = 3;
  string checksum_sha256 = 4;
  int32 mode = 5;
  bool create_dirs = 6;
  int64 offset = 7;
}

message UploadResult {
  bool success = 1;
  string error = 2;
  int64 bytes_written = 3;
  string checksum_sha256 = 4;
}

message DownloadRequest {
  string path = 1;
  int64 offset = 2;
  int64 length = 3;
}

message DownloadChunk {
  bytes data = 1;
  int64 offset = 2;
  int64 total_size = 3;
  string checksum_sha256 = 4;
  bool is_final = 5;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_SOCKET = 4;
  FILE_TYPE_FIFO = 5;
  FILE_TYPE_BLOCK_DEVICE = 6;
  FILE_TYPE_CHAR_DEVICE = 7;
}

enum FileOperationType {
  FILE_OPERATION_TYPE_UNSPECIFIED = 0;
  FILE_OPERATION_TYPE_DELETE = 1;
  FILE_OPERATION_TYPE_MOVE = 2;
  FILE_OPERATION_TYPE_COPY = 3;
  FILE_OPERATION_TYPE_CHMOD = 4;
  FILE_OPERATION_TYPE_CHOWN = 5;
  FILE_OPERATION_TYPE_MKDIR = 6;
  FILE_OPERATION_TYPE_TOUCH = 7;
  FILE_OPERATION_TYPE_STAT = 8;
  FILE_OPERATION_TYPE_EXISTS = 9;
  FILE_OPERATION_TYPE_HASH = 10;
}

enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;
  HASH_ALGORITHM_MD5 = 1;
  HASH_ALGORITHM_SHA1 = 2;
  HASH_ALGORITHM_SHA256 = 3;
  HASH_ALGORITHM_SHA512 = 4;
  HASH_ALGORITHM_CRC32 = 5;  // IEEE polynomial
  HASH_ALGORITHM_CRC64 = 6;  // ECMA-182 polynomial
}

message FileOperationRequest {
  FileOperationType operation = 1;
  string request_id = 2;
  oneof parameters {
    DeleteParams delete_params = 3;
    MoveParams move_params = 4;
    CopyParams copy_params = 5;
    ChmodParams chmod_params = 6;
    ChownParams chown_params = 7;
    MkdirParams mkdir_params = 8;
    TouchParams touch_params = 9;
    StatParams stat_params = 10;
    ExistsParams exists_params = 11;
    HashParams hash_params = 12;
  }
}

message DeleteParams {
  string path = 1;
  bool recursive = 2;
}

message MoveParams {
  string source = 1;
  string destination = 2;
}

message CopyParams {
  string source = 1;
  string destination = 2;
  bool recursive = 3;
}

message ChmodParams {
  string path = 1;
  int32 mode = 2;
}

message ChownParams {
  string path = 1;
  int32 uid = 2;
  int32 gid = 3;
}

message MkdirParams {
  string path = 1;
  bool recursive = 2;
  int32 mode = 3;
  string owner_user = 4;
  int32 owner_uid = 5;
  int32 owner_gid = 6;
}

message TouchParams {
  string path = 1;
}

message StatParams {
  string path = 1;
}

message ExistsParams {
  string path = 1;
}

// Directories are not expanded: a directory in paths yields a per-file error.
message HashParams {
  repeated string paths = 1;
  HashAlgorithm algorithm = 2;
}

message FileOperationResponse {
  bool success = 1;
  string error = 2;
  string request_id = 5;
  oneof result {
    StatResult stat_result = 6;
    ExistsResult exists_result = 7;
    HashResult hash_result = 8;
  }
}

message StatResult {
  FileStat stat = 1;
}

message ExistsResult {
  bool exists = 1;
}

// A per-file failure is reported in error, the whole operation still succeeds.
message FileHash {
  string path = 1;
  string hash = 2;  // lowercase hex, empty when error is set
  uint64 size = 3;
  string error = 4;
}

message HashResult {
  HashAlgorithm algorithm = 1;
  repeated FileHash hashes = 2;
}

message FileStat {
  string name = 1;
  string path = 2;
  uint64 size = 3;
  uint64 allocated_size = 4;
  uint32 mode = 5;
  uint32 uid  = 6;
  uint32 gid  = 7;
  google.protobuf.Timestamp modified_at = 8;
  google.protobuf.Timestamp accessed_at = 9;
  google.protobuf.Timestamp changed_at = 10;
  google.protobuf.Timestamp created_at = 11;
  FileType type = 12;
  map<string, bytes> xattrs = 13;
  string symlink_target = 14;
}

message ListDirectoryRequest {
  string path = 1;
  bool recursive = 2;
  string pattern = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListDirectoryResponse {
  bool success = 1;
  string error = 2;
  repeated FileStat files = 3;
  int32 total_count = 4;
}

// Every listed format is expected to be supported; a daemon that cannot handle
// the requested one answers with an error instead.
enum ArchiveFormat {
  // Extracting resolves the format by magic bytes or extension, creating
  // resolves it by the target file extension.
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_ZIP = 1;
  ARCHIVE_FORMAT_TAR = 2;
  ARCHIVE_FORMAT_TAR_GZ = 3;
  ARCHIVE_FORMAT_TAR_BZ2 = 4;
  ARCHIVE_FORMAT_TAR_XZ = 5;
  ARCHIVE_FORMAT_TAR_ZSTD = 6;
  // Single-file stream compression, carries no directory structure.
  ARCHIVE_FORMAT_GZ = 7;
  ARCHIVE_FORMAT_BZ2 = 8;
  ARCHIVE_FORMAT_XZ = 9;
  ARCHIVE_FORMAT_ZSTD = 10;
  // Extraction only: creating these is not supported, requesting one in
  // CreateArchiveParams is answered with an error.
  ARCHIVE_FORMAT_7Z = 11;
  ARCHIVE_FORMAT_RAR = 12;
}

enum ArchiveConflictPolicy {
  ARCHIVE_CONFLICT_POLICY_UNSPECIFIED = 0;  // same as ERROR
  ARCHIVE_CONFLICT_POLICY_ERROR = 1;
  ARCHIVE_CONFLICT_POLICY_SKIP = 2;
  ARCHIVE_CONFLICT_POLICY_OVERWRITE = 3;
}

// Long-running operation: the daemon reports ArchiveProgress until it answers
// with a single final ArchiveResponse carrying the same request_id.
message ArchiveRequest {
  string request_id = 1;

  oneof operation {
    ExtractArchiveParams extract = 2;
    CreateArchiveParams create = 3;
  }

  google.protobuf.Duration progress_interval = 4;  // 0 = daemon default
  google.protobuf.Duration timeout = 5;            // 0 = daemon default
}

// Entries resolving outside destination must be rejected by the daemon.
message ExtractArchiveParams {
  string archive_path = 1;
  string destination = 2;
  ArchiveFormat format = 3;
  bool create_destination = 4;
  ArchiveConflictPolicy conflict_policy = 5;
  bool preserve_permissions = 6;
  int32 mode = 7;  // applied when preserve_permissions is false
  string owner_user = 8;
  int32 owner_uid = 9;
  int32 owner_gid = 10;
  uint64 max_total_bytes = 11;  // uncompressed payload limit, guards decompression bombs, 0 = daemon default
  uint32 max_files = 12;        // 0 = daemon default
}

// Entry names are stored relative to base_path.
message CreateArchiveParams {
  string archive_path = 1;
  // Extraction-only values (ARCHIVE_FORMAT_7Z, ARCHIVE_FORMAT_RAR) are rejected here.
  ArchiveFormat format = 2;
  string base_path = 3;
  // Resolved relative to base_path, unlike every other path in this file; the
  // source string itself becomes the entry name inside the archive. "." (or
  // "") stores the children of base_path without a "." entry.
  repeated string sources = 4;
  optional int32 compression_level = 5;  // unset = format default, 0 = store, 1..9
  bool follow_symlinks = 6;
  bool overwrite = 7;
  int32 mode = 8;
  string owner_user = 9;
  int32 owner_uid = 10;
  int32 owner_gid = 11;
  uint64 max_total_bytes = 12;
  uint32 max_files = 13;
}

message ArchiveProgress {
  string request_id = 1;
  uint32 files_processed = 2;
  uint32 files_total = 3;      // 0 when unknown
  uint64 bytes_processed = 4;  // uncompressed payload
  uint64 bytes_total = 5;      // 0 when unknown
  string current_entry = 6;
}

message ArchiveResponse {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  uint32 files_processed = 4;
  uint64 bytes_processed = 5;
  uint64 archive_size = 6;      // created archive when packing, source archive when extracting
  repeated string skipped = 7;  // may be truncated by the daemon
  uint32 skipped_count = 8;
  ArchiveFormat format = 9;     // format the daemon actually used
}

message ArchiveCancel {
  string request_id = 1;
  string reason = 2;
}
