syntax = "proto3";

package gameap.plugin.sdk.secrets;

option go_package = "github.com/gameap/gameap/pkg/plugin/sdk/secrets";

// SecretsService stores plugin credentials encrypted at rest, unlike the
// plaintext gameap-storage payloads. Every method requires the "secrets"
// grant; without it the call answers success = false with an explanatory
// error, so the module stays importable and a plugin can degrade gracefully
// instead of failing to load.
// go:plugin type=host module=gameap-secrets
service SecretsService {
  rpc Get(SecretGetRequest) returns (SecretGetResponse);
  rpc Set(SecretSetRequest) returns (SecretSetResponse);
  rpc Delete(SecretDeleteRequest) returns (SecretDeleteResponse);
  rpc ListKeys(SecretListKeysRequest) returns (SecretListKeysResponse);
}

message SecretGetRequest {
  string key = 1;
}

message SecretGetResponse {
  string value = 1;
  bool found = 2;
  optional string error = 3;
}

message SecretSetRequest {
  string key = 1;
  string value = 2;
}

message SecretSetResponse {
  bool success = 1;
  optional string error = 2;
}

message SecretDeleteRequest {
  string key = 1;
}

message SecretDeleteResponse {
  bool success = 1;
  optional string error = 2;
}

message SecretListKeysRequest {
  optional string key_prefix = 1;
}

message SecretListKeysResponse {
  repeated string keys = 1;
  optional string error = 2;
}
