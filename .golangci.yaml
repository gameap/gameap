version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - err113
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - forbidigo
    - funlen
    #- forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - iface
    - importas
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    # - wrapcheck
  settings:
    depguard:
      rules:
        prevent_unmaintained_packages:
          list-mode: lax
          files:
            - $all
            - '!$test'
          allow:
            - $gostd
          deny:
            - pkg: io/ioutil
              desc: 'replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil'
    funlen:
      lines: 100
      statements: 60
    goconst:
      # Column, field and wire-protocol names: they are written literally at
      # every use site by nature, and a shared constant would couple unrelated
      # queries and protocol parsers to each other.
      ignore-string-values:
        - "localhost"
        - "email"
        - "name"
        - "server_id"
        - "created_at"
        - "updated_at"
        - "mysql"
        - "status"
        - "plugin_id"
        - "entity_id"
        - "entity_type"
        - "user_id"
        - "expires_at"
        - "scope"
        - "key"
        - "enabled"
        - "processed"
        - "trigger"
        - "open"
        - "stat"
        - "readdir"
        - "numplayers"
        - "maxplayers"
        - "map"
        - "'self'"
        - "blob:"
    loggercheck:
      slog: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go|test
        linters:
          - depguard
          - goconst
          - dupl
          - funlen
          - gocognit
          - gosec
          - godox
          - govet
          - lll
          - noctx
          - scopelint
      # Prometheus label vocabulary ("plugin", "module", "rpc", "result", ...):
      # label names are written literally at every metric declaration.
      - path: internal/telemetry/
        linters:
          - goconst
      # The route table spells every path literally; a constant for one of the
      # repeated ones would hide it among hundreds of neighbours.
      - path: internal/api/router\.go
        linters:
          - goconst
      - path: internal/repositories/(mysql|postgres|sqlite|cached)/
        linters:
          - paralleltest
      - path: internal/pubsub/(postgres|redis)/
        linters:
          - paralleltest
      - path: internal/cache/(mysql|postgres|redis)_test\.go
        linters:
          - paralleltest
      - path: migrations/
        linters:
          - err113
          - funlen
          - lll
          - revive
      - path: internal/api/router\.go
        linters:
          - revive
        text: var-naming
      - path: pkg/api/
        linters:
          - revive
        text: var-naming
      - path: internal/plugin/hostlibrary/
        linters:
          - nilerr
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

