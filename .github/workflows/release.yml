on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      # Bump together: SYFT_SHA256 is the syft_<version>_linux_amd64.tar.gz line
      # of syft_<version>_checksums.txt in the anchore/syft release.
      SYFT_VERSION: 1.54.1
      SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
    strategy:
      matrix:
        goos: ["linux", "windows", "darwin"]
        goarch: ["amd64", "386", "arm64"]
        exclude:
          - goarch: "386"
            goos: darwin
    steps:
      - uses: actions/checkout@v5

      - name: Set APP_VERSION env
        run: echo "APP_VERSION=$(echo "${GITHUB_REF}" | rev | cut -d'/' -f 1 | rev )" >> "${GITHUB_ENV}"
      - name: Set BUILD_TIME env
        run: echo "BUILD_TIME=$(date --iso-8601=seconds)" >> "${GITHUB_ENV}"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Build UI
        env:
          SBOM_PACKAGES_DIR: ${{ runner.temp }}/sbom/web/frontend
        run: |
          cd web/frontend
          npm ci
          npm run build --if-present

      - uses: wangyoucao577/go-release-action@v1.53
        id: build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: 1.27.2
          md5sum: false
          sha256sum: true
          overwrite: true
          project_path: "./cmd/gameap"
          ldflags: -X "github.com/gameap/gameap/internal/application/defaults.Version=${{ env.APP_VERSION }}" -X "github.com/gameap/gameap/internal/application/defaults.BuildDate=${{ env.BUILD_TIME }}"
          binary_name: "gameap"

      # SBOM failures do not fail the job: the archives are already on the GitHub
      # release, and a failed job would leave S3 and releases.json behind it.
      - name: Install Syft
        id: syft
        continue-on-error: true
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}" syft

      # The SBOM covers the shipped binary: Go modules from its build info and the
      # npm packages that Vite bundled into the embedded UI (see vite.config.js).
      - name: Generate SBOM
        if: steps.syft.outcome == 'success'
        continue-on-error: true
        env:
          ASSET_DIR: ${{ steps.build.outputs.release_asset_dir }}
          TARGET: ${{ matrix.goos }}-${{ matrix.goarch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYFT_CHECK_FOR_APP_UPDATE: false
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          cp "${ASSET_DIR}"/* "${RUNNER_TEMP}/sbom/"

          # Keep "<tag>-<os>-<arch>" out of the name: gameapctl installs the first
          # release asset whose name contains it.
          sbom="${RUNNER_TEMP}/gameap-${APP_VERSION}-sbom-${TARGET}.cdx.json"

          "${RUNNER_TEMP}/syft" scan "dir:${RUNNER_TEMP}/sbom" \
            --override-default-catalogers go-module-binary-cataloger,javascript-package-cataloger \
            --select-catalogers -file \
            --enrich golang \
            --source-name gameap \
            --source-version "${APP_VERSION}" \
            --source-supplier GameAP \
            -o "cyclonedx-json@1.6=${sbom}"

          for ecosystem in golang npm; do
            jq -e --arg prefix "pkg:${ecosystem}/" 'any(.components[]; (.purl // "") | startswith($prefix))' "${sbom}" > /dev/null \
              || { echo "::error::SBOM has no ${ecosystem} packages"; exit 1; }
          done

          gh release upload "${APP_VERSION}" "${sbom}" --clobber --repo "${GITHUB_REPOSITORY}"

          # The S3 step uploads the whole asset dir, so only a checked SBOM that
          # is on the release goes there.
          mv "${sbom}" "$(dirname "${ASSET_DIR}")/"

      - name: Upload assets to S3
        if: ${{ env.S3_ENDPOINT != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX || 'gameap' }}
          ASSET_DIR: ${{ steps.build.outputs.release_asset_dir }}
        run: |
          aws configure set default.s3.addressing_style path

          assets_dir=$(dirname "${ASSET_DIR}")
          for file in "${assets_dir}/gameap-${APP_VERSION}-"*; do
            name=$(basename "${file}")
            aws s3 cp "${file}" "s3://${S3_BUCKET}/${S3_PREFIX}/${APP_VERSION}/${name}" --endpoint-url "${S3_ENDPOINT}"
            aws s3 cp "${file}" "s3://${S3_BUCKET}/${S3_PREFIX}/latest/${name/-${APP_VERSION}-/-}" --endpoint-url "${S3_ENDPOINT}"
          done

  releases-json:
    name: Upload releases JSON to S3
    runs-on: ubuntu-latest
    needs: releases-matrix
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
    steps:
      - name: Fetch releases from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -o releases.json
          jq empty releases.json

      - name: Upload releases JSON to S3
        if: ${{ env.S3_ENDPOINT != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX || 'gameap' }}
        run: |
          aws configure set default.s3.addressing_style path

          aws s3 cp releases.json "s3://${S3_BUCKET}/${S3_PREFIX}/releases.json" \
            --endpoint-url "${S3_ENDPOINT}" \
            --content-type "application/json"
