type: string
enum:
  - ""
  - string
  - text
  - int
  - float
  - bool
  - select
  - password
description: |
  Widget type in the panel and base value format. An omitted or empty value
  means `string` (a plain input) — every game mod written before the type
  existed carries the empty one. The stored value is always substituted into
  commands as a string.
example: "int"
