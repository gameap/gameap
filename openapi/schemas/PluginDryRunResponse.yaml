type: object
description: Plugin dry-run validation response
properties:
  id:
    type: string
    description: Plugin compact ID
    example: "myplugin_com_example"
  name:
    type: string
    description: Plugin name
    example: "My Plugin"
  version:
    type: string
    description: Plugin version
    example: "1.0.0"
  description:
    type: string
    description: Plugin description
    example: "A plugin that does something useful"
  author:
    type: string
    description: Plugin author
    example: "Plugin Author"
  api_version:
    type: string
    description: Plugin API version
    example: "v1"
  required_permissions:
    type: array
    description: Required permissions for the plugin
    items:
      type: string
    example: ["manage_servers"]
  http_routes:
    type: array
    description: HTTP routes exposed by the plugin
    items:
      type: object
      properties:
        path:
          type: string
          example: "/stats"
        methods:
          type: array
          items:
            type: string
          example: ["GET"]
  server_abilities:
    type: array
    description: Server abilities provided by the plugin
    items:
      type: object
      properties:
        name:
          type: string
          example: "custom_restart"
        title:
          type: string
          example: "Custom Restart"
  subscribed_events:
    type: array
    description: Events the plugin subscribes to
    items:
      type: string
    example: ["SERVER_POST_START"]
  has_frontend_bundle:
    type: boolean
    description: Whether the plugin has a frontend bundle
    example: true
  frontend_bundle_size:
    type: integer
    description: Size of the frontend bundle in bytes
    example: 12345
  has_frontend_styles:
    type: boolean
    description: Whether the plugin has frontend styles
    example: false
  installed:
    type: boolean
    description: |
      Whether a plugin with this ID is already installed. When true the
      upload has to be confirmed as an update (`update=true` on
      /api/admin/plugins/upload/install).
    example: false
  installed_version:
    type: string
    description: Version currently installed, empty when the plugin is new
    example: "1.0.0"
  new_permissions:
    type: array
    description: |
      Permissions the uploaded build requires that the installed plugin has
      not been granted yet. Only filled when `installed` is true; confirming
      the update grants them.
    items:
      type: string
    example: ["secrets"]
  is_valid:
    type: boolean
    description: Whether the plugin is valid and can be installed
    example: true
  errors:
    type: array
    description: Validation errors if any
    items:
      type: string
    example: []
required:
  - id
  - name
  - version
  - installed
  - is_valid
  - errors
