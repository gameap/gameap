type: object
properties:
  status:
    type: string
    enum:
      - error
    example: error
  error:
    type: string
    description: Error message
    example: Invalid credentials
  message:
    type: string
    description: Error message (backward compatibility)
    example: Invalid credentials
  http_code:
    type: integer
    description: HTTP status code (backward compatibility)
    example: 422
  title:
    type: string
    description: i18n key of the error title, when the client should translate it
  errors:
    type: object
    description: Per-field validation messages (422 responses of endpoints that validate fields)
    additionalProperties:
      type: string
    example:
      port: must be between 1 and 65535
required:
  - status
  - error
