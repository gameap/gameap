type: object
description: |
  The configuration schema a plugin declares in its manifest
  (`PluginInfo.config_schema`), rendered as an ordered property list so the
  admin form needs no JSON Schema parser. Absent (`null`) for a plugin with
  free-form key/value configuration.
properties:
  properties:
    type: array
    description: Declared properties in manifest order
    items:
      type: object
      properties:
        name:
          type: string
          example: api_key
        type:
          type: string
          enum: [string, integer, number, boolean]
        title:
          type: string
        description:
          type: string
        secret:
          type: boolean
          description: |
            The value is stored encrypted and never returned by the API;
            `secrets_set` tells whether one is stored.
        required:
          type: boolean
        default:
          description: Default the plugin receives when the key is not set (string, number or boolean)
        enum:
          type: array
          items: {}
        minimum:
          type: number
        maximum:
          type: number
        min_length:
          type: integer
        max_length:
          type: integer
        pattern:
          type: string
          description: RE2 regular expression the value must match
      required:
        - name
        - type
  additional_properties:
    type: boolean
    description: Whether keys the schema does not declare are accepted (as strings)
required:
  - properties
  - additional_properties
