type: object
description: User profile with roles and permissions
properties:
  id:
    type: integer
    description: User ID
    example: 1
  login:
    type: string
    description: Username
    example: "admin"
  email:
    type: string
    format: email
    description: Email address
    example: "admin@example.com"
  name:
    type:
      - string
      - "null"
    description: Display name
    example: "Administrator"
  roles:
    type: array
    description: User role names
    items:
      type: string
    example: ["admin"]
  two_factor_enabled:
    type: boolean
    description: Whether two-factor authentication is active for this user.
    example: false
required:
  - id
  - login
  - email
  - roles
  - two_factor_enabled
