type: object
description: |
  The plugin's own status report on the answering instance
  (`gameap-host` `ReportStatus`).
properties:
  status:
    type: string
    enum: [healthy, degraded, unhealthy, unknown]
  message:
    type: string
  details:
    type: object
    additionalProperties:
      type: string
  reported_at:
    type: string
    format: date-time
required:
  - status
  - reported_at
