type: object
description: |
  Installed plugin merged with the runtime state of the panel instance that
  answered the request. `status`, `error` and `error_at` come from the shared
  database record (the last outcome observed on any instance); `loaded`,
  `enabled` and `memory_bytes` describe this instance only.
properties:
  id:
    type: string
    description: Plugin compact ID (from plugin info)
    example: "myplugin_com_example"
  name:
    type: string
    description: Plugin name
    example: "My Plugin"
  version:
    type: string
    description: Plugin version
    example: "1.0.0"
  description:
    type: string
    description: Plugin description
    example: "My Plugin description"
  source:
    type: string
    description: Plugin source URL or file path
    example: "file://123456789.wasm"
  source_type:
    type: string
    description: Plugin source type
    enum:
      - file
      - store
    example: "file"
  enabled:
    type: boolean
    description: Whether the plugin is loaded on this instance and receiving events and HTTP requests
    example: true
  loaded:
    type: boolean
    description: Whether a module instance of the plugin exists on this panel instance
    example: true
  status:
    type: string
    description: |
      Lifecycle status. `active` — running; `error` — the last load or guest
      call failed (retried on the next panel start, reloadable on demand);
      `disabled` — switched off by the operator; `updating` — an update is in
      progress.
    enum:
      - active
      - error
      - disabled
      - updating
    example: "active"
  error:
    type: string
    nullable: true
    description: Why the plugin is in status `error` (load failure or runtime disable reason)
    example: "http handler timed out (GET /status)"
  error_at:
    type: string
    format: date-time
    nullable: true
    description: When `error` was recorded
  memory_bytes:
    type: integer
    format: int64
    nullable: true
    description: Current linear memory of the module on this instance; null when not loaded or while a guest call is in flight
    example: 4194304
  http_routes:
    type: array
    description: HTTP routes exposed by the plugin
    items:
      type: object
      properties:
        path:
          type: string
          example: "/stats"
        methods:
          type: array
          items:
            type: string
          example: ["GET"]
  server_abilities:
    type: array
    description: Server abilities provided by the plugin
    items:
      type: object
      properties:
        name:
          type: string
          example: "custom_restart"
        title:
          type: string
          example: "Custom Restart"
  has_frontend_bundle:
    type: boolean
    description: Whether the plugin has a frontend bundle
    example: true
  required_permissions:
    type: array
    description: Permissions the plugin declares in its manifest
    items:
      $ref: './PluginPermission.yaml'
    example: ["files", "listen_events"]
  allowed_permissions:
    type: array
    description: Permissions the operator granted; the runtime source of truth
    items:
      $ref: './PluginPermission.yaml'
    example: ["files", "listen_events"]
  used_permissions:
    type: array
    nullable: true
    description: |
      Permissions the module can exercise, derived from the host functions
      it imports and its event subscriptions. `null` when the plugin is not
      loaded on the instance that answered (unknown); an empty list when it
      is loaded and exercises nothing gated.
    items:
      $ref: './PluginPermission.yaml'
    example: ["files", "node_commands", "listen_events"]
  missing_permissions:
    type: array
    nullable: true
    description: |
      Used permissions the plugin does not hold: while the panel enforces
      permissions (`PLUGIN_PERMISSIONS_ENFORCE`), every call behind them is
      refused until an operator grants them. `null` when the plugin is not
      loaded on the instance that answered (unknown).
    items:
      $ref: './PluginPermission.yaml'
    example: ["node_commands"]
required:
  - id
  - name
  - version
  - source_type
  - enabled
  - loaded
  - status
