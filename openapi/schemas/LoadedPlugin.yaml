type: object
description: Loaded plugin with runtime status
properties:
  id:
    type: string
    description: Plugin compact ID (from plugin info)
    example: "myplugin_com_example"
  name:
    type: string
    description: Plugin name
    example: "My Plugin"
  version:
    type: string
    description: Plugin version
    example: "1.0.0"
  description:
    type: string
    description: Plugin description
    example: "My Plugin description"
  source:
    type: string
    description: Plugin source URL or file path
    example: "file://123456789.wasm"
  source_type:
    type: string
    description: Plugin source type
    enum:
      - file
      - store
    example: "file"
  enabled:
    type: boolean
    description: Whether the plugin is enabled
    example: true
  http_routes:
    type: array
    description: HTTP routes exposed by the plugin
    items:
      type: object
      properties:
        path:
          type: string
          example: "/stats"
        methods:
          type: array
          items:
            type: string
          example: ["GET"]
  server_abilities:
    type: array
    description: Server abilities provided by the plugin
    items:
      type: object
      properties:
        name:
          type: string
          example: "custom_restart"
        title:
          type: string
          example: "Custom Restart"
  has_frontend_bundle:
    type: boolean
    description: Whether the plugin has a frontend bundle
    example: true
  db_status:
    type: string
    description: >
      Status recorded in the database, which is shared by every panel instance.
      Absent when the module is loaded but no row explains it.
    enum:
      - active
      - disabled
      - error
      - updating
    example: "active"
  sync_state:
    type: string
    description: >
      How this instance's runtime compares with the database row. Reported per
      instance and not aggregated: a plugin can be in_sync on one replica and
      retrying on another. `orphan` means the module is loaded with no row to
      explain it, and is left alone. `pending` means the row is active and this
      instance has not attempted it yet.
    enum:
      - in_sync
      - retrying
      - orphan
      - pending
    example: "in_sync"
  sync_error:
    type: string
    description: Why the last attempt on this instance failed
    example: "plugin file is missing and the plugin was not installed from the store"
  sync_failures:
    type: integer
    description: Consecutive failed attempts on this instance
    example: 3
  next_attempt_at:
    type: string
    format: date-time
    description: When this instance will retry a failed plugin
  loaded_at:
    type: string
    format: date-time
    description: When this instance last loaded the plugin
required:
  - id
  - name
  - version
  - source_type
  - enabled
