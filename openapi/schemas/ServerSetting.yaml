type: object
description: |
  Server setting as returned by `GET /api/servers/{server}/settings`.
  Settings merge the game mod variable definition (`type`, `label`, `options`,
  `rules`, …) with the per-server override (`value`). For the update payload of
  `PUT /api/servers/{server}/settings` see `UpdateServerSettingsRequest`.

  `value` and `default` are typed after `type`: boolean for `bool`, number for
  `int`/`float`, string for `string`, `text`, `password` and `select`.
  Whatever the JSON type, the panel stores the value as the string that is
  substituted into `{var}`.
properties:
  name:
    type: string
    description: Setting machine name
    example: "maxplayers"
  value:
    type:
      - boolean
      - number
      - string
    description: Current value, typed after `type`. Never an array, an object or null.
    example: 32
  default:
    type:
      - boolean
      - number
      - string
    description: Value from the game mod template, typed after `type`.
    example: 32
  type:
    $ref: './GameModVarType.yaml'
  label:
    type: string
    description: Human-readable label (base language English)
    example: "Maximum players"
  description:
    type: string
    description: Long help text shown next to the field
  options:
    type: array
    description: |
      Allowed values for a `select` setting. Always the object form here, even
      when the game mod template used the plain-string shorthand.
    items:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string
          description: Defaults to `value`
        i18n:
          $ref: './GameModVarOptionI18n.yaml'
  allow_custom:
    type: boolean
    description: '`select` only: a value outside `options` is accepted'
  rules:
    $ref: './GameModVarRules.yaml'
  i18n:
    $ref: './GameModVarI18n.yaml'
  admin_var:
    type: boolean
    description: Whether the setting is admin-only (omitted when false)
required:
  - name
  - value
  - type
  - label
