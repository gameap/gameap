type: object
minProperties: 1
description: |
  Button label translations keyed by lowercase BCP-47 locale.
  `en` is not allowed: the base label lives in the `info` field.
propertyNames:
  # The lookahead excludes the base language; the panel checks that half
  # separately because Go's RE2 has no lookarounds.
  pattern: '^(?!en$)[a-z]{2,3}(-[a-z0-9]+)*$'
additionalProperties:
  type: object
  required:
    - info
  properties:
    info:
      type: string
      minLength: 1
      maxLength: 128
example:
  ru:
    info: "Статус"
