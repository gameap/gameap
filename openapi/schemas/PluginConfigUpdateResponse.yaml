allOf:
  - $ref: './PluginConfigResponse.yaml'
  - type: object
    description: Outcome of the reload the save triggered on this instance
    properties:
      reloaded:
        type: boolean
        description: |
          Whether the plugin was restarted with the new configuration; false
          for a plugin in status `disabled` / `updating` and when the reload
          failed (see `reload_error`).
      status:
        type: string
        enum: [active, disabled, error, updating]
      error:
        type: string
        nullable: true
      error_at:
        type: string
        format: date-time
        nullable: true
      last_loaded_at:
        type: string
        format: date-time
        nullable: true
      reload_error:
        type: string
        description: Why the reload failed; the configuration is saved regardless
    required:
      - reloaded
      - status
