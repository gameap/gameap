type: object
description: Update game mod request
properties:
  game_code:
    type: string
    description: Game code the mod belongs to
    example: "cstrike"
  name:
    type: string
    description: Mod name
  fast_rcon:
    type:
      - array
      - "null"
    description: Fast RCON commands
    items:
      $ref: '../GameModFastRcon.yaml'
  vars:
    type:
      - array
      - "null"
    description: Mod variables
    items:
      $ref: '../GameModVar.yaml'
  remote_repository_linux:
    type:
      - string
      - "null"
  remote_repository_windows:
    type:
      - string
      - "null"
  local_repository_linux:
    type:
      - string
      - "null"
  local_repository_windows:
    type:
      - string
      - "null"
  start_cmd_linux:
    type:
      - string
      - "null"
  start_cmd_windows:
    type:
      - string
      - "null"
  kick_cmd:
    type:
      - string
      - "null"
  ban_cmd:
    type:
      - string
      - "null"
  chname_cmd:
    type:
      - string
      - "null"
  srestart_cmd:
    type:
      - string
      - "null"
  chmap_cmd:
    type:
      - string
      - "null"
  sendmsg_cmd:
    type:
      - string
      - "null"
  passwd_cmd:
    type:
      - string
      - "null"
  metadata:
    type:
      - object
      - "null"
    description: Game mod metadata (arbitrary key-value pairs)
    additionalProperties: true
