type: object
description: Create server request
properties:
  name:
    type: string
    description: Server name
    maxLength: 128
    example: "My CS Server"
  ds_id:
    oneOf:
      - type: integer
      - type: string
    description: Node (dedicated server) ID
    example: 1
  game_id:
    type: string
    description: Game code
    example: "cstrike"
  game_mod_id:
    oneOf:
      - type: integer
      - type: string
    description: Game mod ID
    example: 1
  server_ip:
    type: string
    description: >-
      Server IP address or hostname. Omit it to let the panel take the first IP
      address of the node on which every port of the server is free.
    example: "192.168.1.100"
  server_port:
    oneOf:
      - type: integer
        minimum: 1
        maximum: 65535
      - type: string
        pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
    description: >-
      Server port (1-65535). Omit it to let the panel pick the first free port
      from the node's `port_range` metadata; without a port range the field is
      required.
    example: 27015
  query_port:
    oneOf:
      - type: integer
        minimum: 1
        maximum: 65535
      - type: string
        pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
    description: >-
      Query port (1-65535), optional. When it is omitted and the start command
      passes `{query_port}`, the panel picks a free port from the node's
      `port_range`; otherwise the server is queried on its server port.
    example: 27016
  rcon_port:
    oneOf:
      - type: integer
        minimum: 1
        maximum: 65535
      - type: string
        pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
    description: >-
      RCON port (1-65535), optional. When it is omitted and the start command
      passes `{rcon_port}`, the panel picks a free port from the node's
      `port_range`; otherwise RCON uses the server port.
    example: 27017
  rcon:
    type: string
    description: RCON password
    example: "secret"
  dir:
    type: string
    description: Server directory path
    example: "/home/servers/cs/server1"
  start_command:
    type: string
    description: Custom start command
  su_user:
    type: string
    description: System user for running server
    example: "gameserver"
  install:
    oneOf:
      - type: boolean
      - type: string
    description: Auto-install server after creation
    example: true
  settings:
    type: array
    description: Initial server settings (optional)
    items:
      $ref: '../ServerSettingInput.yaml'
required:
  - name
  - ds_id
  - game_id
  - game_mod_id
