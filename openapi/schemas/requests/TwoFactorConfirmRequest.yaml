type: object
description: |
  Confirms a pending TOTP enrollment started by `POST /api/profile/2fa/setup`.
  A valid code proves the authenticator app was provisioned with the secret;
  2FA is only activated after this step succeeds.
properties:
  code:
    type: string
    description: 6-digit TOTP code generated by the authenticator app.
    example: "123456"
required:
  - code
