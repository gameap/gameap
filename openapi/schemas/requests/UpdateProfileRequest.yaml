type: object
description: Update profile request
properties:
  name:
    type:
      - string
      - "null"
    description: Display name
    maxLength: 255
    example: "John Doe"
  current_password:
    type: string
    description: Current password (required if changing password)
  password:
    type: string
    description: |
      New password. OWASP ASVS 4.0.3 §2.1.1 / §2.1.2 — 12 to 128 characters
      and not in the embedded common-password blocklist (ASVS §2.1.7).
      Sending it requires current_password. The blocklist check is skipped
      when the server is started with `AUTH_ALLOW_WEAK_PASSWORDS=true`.
    minLength: 12
    maxLength: 128
    example: "YourSecure-Pass-2026"
