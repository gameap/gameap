type: object
description: Update profile request
properties:
  name:
    type:
      - string
      - "null"
    description: Display name
    maxLength: 255
    example: "John Doe"
  current_password:
    type: string
    description: Current password (required if changing password)
  password:
    type: string
    description: New password (OWASP ASVS 4.0.3 §2.1.1 / §2.1.2 — 12 to 128 characters; sending it requires current_password)
    minLength: 12
    maxLength: 128
