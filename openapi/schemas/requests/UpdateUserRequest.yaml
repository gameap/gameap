type: object
description: Update user request
properties:
  login:
    type: string
    description: Username
    maxLength: 255
    example: "newuser"
  email:
    type: string
    format: email
    description: Email address
    maxLength: 255
    example: "user@example.com"
  password:
    type: string
    description: |
      New password. Leave empty to keep current. When set: OWASP ASVS 4.0.3
      §2.1.1 / §2.1.2 (12 to 128 characters) and not in the embedded
      common-password blocklist (ASVS §2.1.7). The blocklist check is
      skipped when the server is started with `AUTH_ALLOW_WEAK_PASSWORDS=true`.
    minLength: 12
    maxLength: 128
    example: "YourSecure-Pass-2026"
  name:
    type:
      - string
      - "null"
    description: Display name
    maxLength: 255
    example: "John Doe"
  roles:
    type: array
    description: User roles
    items:
      type: string
    example: ["user"]
