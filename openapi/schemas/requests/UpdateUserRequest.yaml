type: object
description: Update user request
properties:
  login:
    type: string
    description: Username
    maxLength: 255
    example: "newuser"
  email:
    type: string
    format: email
    description: Email address
    maxLength: 255
    example: "user@example.com"
  password:
    type: string
    description: New password (leave empty to keep current; OWASP ASVS 4.0.3 §2.1.1 / §2.1.2 — 12 to 128 characters when set)
    minLength: 12
    maxLength: 128
    example: "newsecretpass1234"
  name:
    type:
      - string
      - "null"
    description: Display name
    maxLength: 255
    example: "John Doe"
  roles:
    type: array
    description: User roles
    items:
      type: string
    example: ["user"]
