type: object
description: |
  Replaces the plugin's configuration. Every non-secret key must be sent;
  keys absent from `values` are removed. A secret key that is omitted or
  `null` keeps its stored value, an empty string clears it, any other
  string replaces it (stored encrypted).
properties:
  values:
    type: object
    additionalProperties: true
    example:
      api_key: "sk-live-0123456789"
      port: 27015
      enabled: true
required:
  - values
