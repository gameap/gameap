            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/stream-file:
  get:
    tags:
      - FileManager
    summary: Stream file
    description: Streams file content (for large files)
    operationId: streamFile
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: path
        in: query
        required: true
        description: File path
        schema:
          type: string
    responses:
      '200':
        description: >-
          File stream. Inline rendering is restricted to a safe allowlist
          (images except SVG, text/plain, application/pdf); every other type is
          forced to attachment + application/octet-stream so stored
          HTML/SVG/JS cannot execute in the panel origin.
        headers:
          Content-Disposition:
            schema:
              type: string
            description: inline for allowlisted types, otherwise attachment
          X-Content-Type-Options:
            schema:
              type: string
            description: Always "nosniff"
          Content-Security-Policy:
            schema:
              type: string
            description: Always "sandbox"
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        description: Invalid path (absolute, NUL byte, backslash or directory traversal)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/paste:
  post:
    tags:
      - FileManager
    summary: Copy/move files
    description: |
      Copies (`clipboard.type: copy`) or moves (`clipboard.type: cut`)
      clipboard items into the `path` directory. All paths are relative to
      the server root directory; backslash separators are normalized to
      forward slashes. Each item lands in `path` under its own basename
      unless `names` overrides it. Existing destination items are silently
      overwritten. Copying an item onto itself is rejected — pass a new
      basename via `names` to duplicate an item in its own directory. Moving
      an item onto itself is skipped as a no-op. Pasting a directory into
      itself or its own subtree is rejected.
    operationId: pasteFiles
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                description: Disk name, only `server` is supported
                enum:
                  - server
              path:
                type: string
                description: >
                  Destination directory relative to the server root
                  directory; empty string or `/` means the root itself
              clipboard:
                type: object
                description: Items to paste and the operation type
                properties:
                  type:
                    type: string
                    description: Operation type
                    enum:
                      - copy
                      - cut
                  disk:
                    type: string
                    description: Source disk name, only `server` is supported
                    enum:
                      - server
                  directories:
                    type: array
                    description: Source directory paths relative to the server root
                    items:
                      type: string
                  files:
                    type: array
                    description: Source file paths relative to the server root
                    items:
                      type: string
                required:
                  - type
                  - disk
                  - directories
                  - files
              names:
                type: object
                description: >
                  Optional destination basenames keyed by the exact source
                  item strings from `clipboard.files` /
                  `clipboard.directories`. Used to paste under a new name,
                  e.g. duplicating `file.txt` in its own directory as
                  `file_1.txt`. Values must be plain names without path
                  separators or `..` components.
                additionalProperties:
                  type: string
            required:
              - disk
              - path
              - clipboard
    responses:
      '200':
        description: Operation completed
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '400':
        description: >
          Bad request (invalid path or name, unsupported disk or clipboard
          type, empty clipboard, copy onto itself, or directory pasted into
          itself)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/hash:
  post:
    tags:
      - FileManager
    summary: Compute file checksums
    description: |
      Computes checksums of the given files on the daemon node and waits
      for the result. Directories are not expanded: a directory path
      yields a per-item error while the whole request still succeeds.
      Per-item failures (missing file, permission denied) are reported in
      the item's `error` field. The request is synchronous and may take
      up to several minutes for large files.
    operationId: hashFiles
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                description: Disk name, only `server` is supported
                enum:
                  - server
              paths:
                type: array
                description: >
                  File paths relative to the server root directory. The
                  server root itself is rejected.
                minItems: 1
                maxItems: 100
                items:
                  type: string
              algorithm:
                type: string
                description: Hash algorithm
                default: sha256
                enum:
                  - md5
                  - sha1
                  - sha256
                  - sha512
                  - crc32
                  - crc64
            required:
              - disk
              - paths
    responses:
      '200':
        description: Checksums computed
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
                  description: Algorithm actually used
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                        description: Path as sent in the request
                      hash:
                        type: string
                        description: Lowercase hex digest, empty when `error` is set
                      size:
                        type: integer
                        format: int64
                        description: File size in bytes
                      error:
                        type: string
                        description: Per-item failure reason
      '400':
        description: Bad request (invalid path, unknown algorithm, or too many paths)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '502':
        description: Daemon is not connected
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/archive:
  post:
    tags:
      - FileManager
    summary: Create archive on the server
    description: |
      Starts an asynchronous archive creation on the daemon node and
      returns an operation ID. Progress and the final result are
      delivered over the
      `/api/ws/servers/{server}/file-manager/archive-operations`
      WebSocket endpoint (frames `archive.progress` / `archive.complete`
      correlated by `operation_id`). The archive is written as
      `path`/`name`; every source must reside under `path` (entry names
      inside the archive are stored relative to it). The daemon node must
      announce the `archive` capability.
    operationId: createFileManagerArchive
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                description: Disk name, only `server` is supported
                enum:
                  - server
              path:
                type: string
                description: >
                  Base directory relative to the server root; empty string
                  or `/` means the root itself. The archive is created in
                  this directory and entry names are stored relative to it.
              name:
                type: string
                description: >
                  Archive file name. When `format` is omitted it is
                  inferred from the extension (`.zip`, `.tar`, `.tar.gz`,
                  `.tgz`, `.tar.bz2`, `.tar.xz`, `.txz`, `.tar.zst`,
                  `.gz`, `.bz2`, `.xz`, `.zst`).
              format:
                type: string
                description: >
                  Explicit archive format; overrides the extension-based
                  inference. `7z` and `rar` are extraction-only and are
                  rejected here.
                enum:
                  - zip
                  - tar
                  - tar_gz
                  - tar_bz2
                  - tar_xz
                  - tar_zstd
                  - gz
                  - bz2
                  - xz
                  - zstd
              sources:
                type: array
                description: >
                  Paths relative to the server root; every entry must
                  reside under `path`. Single-file stream formats (`gz`,
                  `bz2`, `xz`, `zstd`) accept exactly one file.
                minItems: 1
                items:
                  type: string
              compression_level:
                type: integer
                description: >
                  Compression level; omitted = format default, `0` =
                  store.
                minimum: 0
                maximum: 9
              overwrite:
                type: boolean
                description: Overwrite an existing archive file
                default: false
            required:
              - disk
              - name
              - sources
    responses:
      '202':
        description: Archive operation accepted
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_id:
                  type: string
                  description: >
                    Operation ID for WebSocket correlation and
                    cancellation
      '400':
        description: >
          Bad request (invalid path or name, unsupported or
          extraction-only format, empty sources, source outside the base
          path, or invalid compression level)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '502':
        description: Daemon is not connected or does not support archive operations
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/extract:
  post:
    tags:
      - FileManager
    summary: Extract archive on the server
    description: |
      Starts an asynchronous archive extraction on the daemon node and
      returns an operation ID. Progress and the final result are
      delivered over the
      `/api/ws/servers/{server}/file-manager/archive-operations`
      WebSocket endpoint. The archive format is detected from magic bytes
      or the file extension unless `format` is given. Entry permission
      modes stored in the archive are restored. Entries resolving
      outside `destination` are rejected by the daemon. The daemon node
      must announce the `archive` capability.
    operationId: extractFileManagerArchive
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                description: Disk name, only `server` is supported
                enum:
                  - server
              path:
                type: string
                description: Archive file path relative to the server root
              destination:
                type: string
                description: >
                  Destination directory relative to the server root; empty
                  string or `/` means the root itself
              format:
                type: string
                description: Explicit archive format; omitted = auto-detect
                enum:
                  - zip
                  - tar
                  - tar_gz
                  - tar_bz2
                  - tar_xz
                  - tar_zstd
                  - gz
                  - bz2
                  - xz
                  - zstd
                  - 7z
                  - rar
              conflict_policy:
                type: string
                description: What to do when an entry already exists
                default: error
                enum:
                  - error
                  - skip
                  - overwrite
              create_destination:
                type: boolean
                description: Create the destination directory when missing
                default: true
            required:
              - disk
              - path
              - destination
    responses:
      '202':
        description: Extract operation accepted
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_id:
                  type: string
                  description: >
                    Operation ID for WebSocket correlation and
                    cancellation
      '400':
        description: Bad request (invalid path or destination, unknown format or policy)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '502':
        description: Daemon is not connected or does not support archive operations
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/archive-operations/{operationID}/cancel:
  post:
    tags:
      - FileManager
    summary: Cancel a running archive operation
    description: |
      Requests cancellation of a running archive create/extract
      operation. The request is fire-and-forget: the outcome arrives as
      the operation's final `archive.complete` WebSocket frame with an
      error starting with `canceled`. Canceling an unknown or already
      finished operation is a no-op.
    operationId: cancelFileManagerArchiveOperation
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: operationID
        in: path
        required: true
        description: Operation ID returned by the archive/extract endpoint
        schema:
          type: string
    responses:
      '202':
        description: Cancellation requested
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '400':
        description: Bad request (empty operation ID)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '502':
        description: Daemon is not connected
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
