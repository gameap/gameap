/api/file-manager/{server}/initialize:
  get:
    tags:
      - FileManager
    summary: Initialize file manager
    description: Initializes the file manager for a server
    operationId: initializeFileManager
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    responses:
      '200':
        description: File manager initialized
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Base path
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/content:
  get:
    tags:
      - FileManager
    summary: Get file/directory content
    description: Returns the content of a file or directory listing
    operationId: getFileContent
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: path
        in: query
        required: true
        description: File or directory path
        schema:
          type: string
    responses:
      '200':
        description: Content
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Directory listing
                  properties:
                    type:
                      type: string
                      enum: [directory]
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                            enum: [file, directory]
                          size:
                            type: integer
                          modified:
                            type: string
                            format: date-time
                          mode:
                            type: integer
                            minimum: 0
                            maximum: 511
                            description: |
                              Unix file permissions as integer (octal value 0..0o777).
                              Example: 493 = 0o755 = `rwxr-xr-x`.
                - type: object
                  description: File content
                  properties:
                    type:
                      type: string
                      enum: [file]
                    content:
                      type: string
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/tree:
  get:
    tags:
      - FileManager
    summary: Get directory tree
    description: Returns the directory tree structure
    operationId: getDirectoryTree
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: path
        in: query
        required: false
        description: Base path
        schema:
          type: string
    responses:
      '200':
        description: Directory tree
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  path:
                    type: string
                  type:
                    type: string
                  children:
                    type: array
                    items: {}
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/delete:
  post:
    tags:
      - FileManager
    summary: Delete files/directories
    description: Deletes files or directories
    operationId: deleteFiles
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                description: Paths to delete
                items:
                  type: string
            required:
              - items
    responses:
      '200':
        description: Files deleted
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/upload:
  post:
    tags:
      - FileManager
    summary: Upload file
    description: Uploads a file to the server
    operationId: uploadFile
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
                description: File to upload
              path:
                type: string
                description: Destination path
            required:
              - file
              - path
    responses:
      '200':
        description: File uploaded
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/update-file:
  post:
    tags:
      - FileManager
    summary: Update file content
    description: Updates the content of a file
    operationId: updateFile
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              path:
                type: string
                description: File path
              content:
                type: string
                description: New file content
            required:
              - path
              - content
    responses:
      '200':
        description: File updated
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/download:
  get:
    tags:
      - FileManager
    summary: Download file
    description: Downloads a file from the server
    operationId: downloadFile
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: path
        in: query
        required: true
        description: File path
        schema:
          type: string
    responses:
      '200':
        description: >-
          File content. Always served as an opaque download
          (Content-Disposition: attachment, application/octet-stream) so a
          stored HTML/SVG file cannot execute in the panel origin.
        headers:
          Content-Disposition:
            schema:
              type: string
            description: attachment with RFC 6266 filename / filename*
          X-Content-Type-Options:
            schema:
              type: string
            description: Always "nosniff"
          Content-Security-Policy:
            schema:
              type: string
            description: Always "sandbox"
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        description: Invalid path (absolute, NUL byte, backslash or directory traversal)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/download-archive:
  get:
    tags:
      - FileManager
    summary: Download directory as ZIP archive
    description: |
      Streams a directory tree as a ZIP archive.
      The total size and file count are reported in response headers
      (`X-Archive-Total-Bytes`, `X-Archive-Total-Files`) before the body
      begins, so the client can show a determinate progress bar.
      Symlinks are preserved as Unix-symlink entries inside the zip.
      Special files (sockets, FIFOs, devices) are skipped and listed in
      a trailing `_SKIPPED.txt` entry.
    operationId: downloadFileManagerArchive
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: disk
        in: query
        required: true
        description: Disk identifier (only `server` is supported)
        schema:
          type: string
          enum: [server]
      - name: path
        in: query
        required: true
        description: Directory path inside the server data directory
        schema:
          type: string
      - name: compress
        in: query
        required: false
        description: |
          Compression level. `0` (default) = ZIP store (no compression,
          maximum throughput). `1`–`9` = DEFLATE with the given level.
        schema:
          type: integer
          minimum: 0
          maximum: 9
          default: 0
    responses:
      '200':
        description: ZIP archive stream
        headers:
          X-Archive-Total-Bytes:
            description: Total uncompressed payload size in bytes (sum of file sizes).
            schema:
              type: integer
              format: int64
          X-Archive-Total-Files:
            description: Number of regular files and symlinks in the archive.
            schema:
              type: integer
          X-Archive-Skipped-Count:
            description: Number of skipped special-file entries (sockets, FIFOs, devices).
            schema:
              type: integer
          Content-Disposition:
            schema:
              type: string
        content:
          application/zip:
            schema:
              type: string
              format: binary
      '400':
        description: Bad request (invalid path, unsupported disk, or invalid compress level)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Directory is empty or not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '413':
        description: Archive total size or file count exceeds configured limits
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '429':
        description: Too many concurrent archive downloads for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/rename:
  post:
    tags:
      - FileManager
    summary: Rename file/directory
    description: |
      Renames a file or directory. Both `oldName` and `newName` are paths
      relative to the server root directory (e.g. `valve/addons` →
      `valve/addons2`), so items inside subdirectories can be renamed. When
      the `newName` parent directory differs from the `oldName` parent, the
      item is moved there. Paths must not contain `..` components and must
      not refer to the server root itself. Backslash separators are
      normalized to forward slashes.
    operationId: renameFile
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                description: Disk name, only `server` is supported
                enum:
                  - server
              oldName:
                type: string
                description: Current path relative to the server root directory
              newName:
                type: string
                description: New path relative to the server root directory
              type:
                type: string
                description: Type of the renamed item
                enum:
                  - file
                  - dir
            required:
              - disk
              - oldName
              - newName
              - type
    responses:
      '200':
        description: File renamed
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '400':
        description: Bad request (invalid path, unsupported disk, or invalid type)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/file-manager/{server}/chmod:
  post:
    tags:
      - FileManager
    summary: Change file permissions
    description: |
      Changes Unix file permissions for one or more files or directories.
      Mode is an integer in the range 0..0o777 (0..511 decimal). Special
      bits (setuid, setgid, sticky) are not supported and will be masked
      off. Operates on the specified path only — directories are not
      modified recursively.
      Items are processed sequentially; the first failing item aborts the
      batch (fail-fast behavior, consistent with `delete` endpoint).
    operationId: chmodFiles
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              disk:
                type: string
                enum: [server]
                description: Disk identifier (only `server` is supported)
              mode:
                type: integer
                minimum: 0
                maximum: 511
                description: |
                  New permissions as integer (octal 0..0o777).
                  Example: 493 = 0o755 = `rwxr-xr-x`.
              items:
                type: array
                description: Paths to chmod
                items:
                  type: object
                  properties:
                    path:
                      type: string
                      description: Path inside the server data directory
                  required:
                    - path
            required:
              - disk
              - mode
              - items
    responses:
      '200':
        description: Permissions changed
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '400':
        description: Bad request (invalid path, mode out of range, unsupported disk)
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: User does not have files permission for this server
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or node not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '500':
        description: Daemon failed to change permissions
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

