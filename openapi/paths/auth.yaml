/api/auth/login:
  post:
    tags:
      - Auth
    summary: Login
    description: Authenticate user and get JWT token
    operationId: login
    security: []
    x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -s -X POST "https://demo.gameap.com/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"login": "admin", "password": "password"}' \
            -w "\nHTTP Status: %{http_code}\n"

      - lang: PHP
        source: |
          <?php

          $url = 'https://demo.gameap.com/api/auth/login';

          $data = [
              'login'    => 'admin',
              'password' => 'password',
          ];

          $curl = curl_init();

          curl_setopt_array($curl, [
              CURLOPT_URL            => $url,
              CURLOPT_POST           => true,
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_TIMEOUT        => 30,
              CURLOPT_HTTP_VERSION   => CURL_HTTP_VERSION_1_1,
              CURLOPT_POSTFIELDS     => json_encode($data),
              CURLOPT_HTTPHEADER     => [
                  'Content-Type: application/json',
              ],
          ]);

          $response = curl_exec($curl);
          $httpCode = curl_getinfo($curl, CURLINFO_HTTP_CODE);

          if (curl_errno($curl)) {
              echo 'Curl error: ' . curl_error($curl);
              curl_close($curl);
              exit(1);
          }

          curl_close($curl);

          if ($httpCode >= 400) {
              echo "HTTP Error: {$httpCode}\n";
              echo $response;
              exit(1);
          }

          $result = json_decode($response, true);

          if (json_last_error() !== JSON_ERROR_NONE) {
              echo 'JSON decode error: ' . json_last_error_msg();
              exit(1);
          }

          // Store token for subsequent requests
          $token = $result['token'];
          echo "Token: {$token}\n";

      - lang: Go
        source: |
          package main

          import (
              "bytes"
              "context"
              "encoding/json"
              "fmt"
              "io"
              "log"
              "net/http"
              "time"
          )

          func main() {
              url := "https://demo.gameap.com/api/auth/login"

              payload := map[string]string{
                  "login":    "admin",
                  "password": "password",
              }

              body, err := json.Marshal(payload)
              if err != nil {
                  log.Fatalf("Failed to marshal payload: %v", err)
              }

              ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
              defer cancel()

              req, err := http.NewRequestWithContext(ctx, http.MethodPost, url, bytes.NewReader(body))
              if err != nil {
                  log.Fatalf("Failed to create request: %v", err)
              }

              req.Header.Set("Content-Type", "application/json")

              client := &http.Client{Timeout: 30 * time.Second}

              resp, err := client.Do(req)
              if err != nil {
                  log.Fatalf("Request failed: %v", err)
              }
              defer resp.Body.Close()

              respBody, err := io.ReadAll(resp.Body)
              if err != nil {
                  log.Fatalf("Failed to read response: %v", err)
              }

              if resp.StatusCode >= 400 {
                  log.Fatalf("HTTP Error %d: %s", resp.StatusCode, string(respBody))
              }

              var result map[string]interface{}
              if err := json.Unmarshal(respBody, &result); err != nil {
                  log.Fatalf("Failed to parse JSON: %v", err)
              }

              fmt.Printf("Token: %s\n", result["token"])
          }

      - lang: NodeJS
        source: |
          const url = 'https://demo.gameap.com/api/auth/login';

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              login: 'admin',
              password: 'password',
            }),
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP Error ${response.status}: ${errorText}`);
          }

          const data = await response.json();

          // Store token for subsequent requests
          const token = data.token;
          console.log('Token:', token);
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/LoginRequest.yaml'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../schemas/responses/LoginResponse.yaml'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: >-
          Validation error, or CAPTCHA verification failed (missing token,
          provider rejection, or reCAPTCHA v3 score below threshold) when a
          CAPTCHA provider is configured.
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '503':
        description: >-
          CAPTCHA provider unreachable while fail-closed (CAPTCHA_FAIL_OPEN
          disabled).
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/auth/logout:
  post:
    tags:
      - Auth
    summary: Logout
    description: |
      Revokes the bearer token used to authenticate this request. Subsequent
      requests presenting the same token return `401 Unauthorized`. The denial
      entry expires together with the token's natural expiration time.
    operationId: logout
    responses:
      '204':
        description: Token revoked
      '401':
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/auth/short-lived-token:
  post:
    tags:
      - Auth
    summary: Issue a short-lived token
    description: |
      Issues a **single-use, short-lived** authorization token (TTL ≤ 10s)
      for the authenticated caller.

      Use it where a credential must travel in the URL — the WebSocket
      upgrade (`/api/ws/*?token=...`) and the file-download endpoints — so the
      long-lived token never leaks into proxy logs, browser history or the
      network inspector. The token is invalidated the first time it
      authenticates a request, so a captured copy is worthless once the
      connection is established. Request a fresh one before every
      (re)connection.

      The minting request itself must authenticate with the long-lived token
      in the `Authorization` header (never the URL). A short-lived token is
      rejected here and on every endpoint that did not explicitly opt in
      (returning `403`); it is accepted only on the WebSocket and
      file-download routes.
    operationId: createShortLivedToken
    x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -s -X POST "https://demo.gameap.com/api/auth/short-lived-token" \
            -H "Authorization: Bearer YOUR_LONG_LIVED_TOKEN" \
            -w "\nHTTP Status: %{http_code}\n"

      - lang: NodeJS
        source: |
          // 1. Mint a short-lived token (long-lived token stays in the header)
          const res = await fetch(
            'https://demo.gameap.com/api/auth/short-lived-token',
            {
              method: 'POST',
              headers: { Authorization: `Bearer ${longLivedToken}` },
            },
          );
          const { token } = await res.json();

          // 2. Use it immediately for the WebSocket upgrade
          const ws = new WebSocket(
            `wss://demo.gameap.com/api/ws/servers/6/console?token=${encodeURIComponent(token)}`,
          );
    responses:
      '200':
        description: Short-lived token issued
        content:
          application/json:
            schema:
              $ref: '../schemas/responses/ShortLivedTokenResponse.yaml'
      '401':
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: A short-lived token cannot be used to mint another
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/auth/2fa/verify:
  post:
    tags:
      - Auth
    summary: Verify second factor at login
    description: |
      Completes a login that requires two-factor authentication. Send the
      single-use `challenge_token` returned by `POST /api/auth/login` together
      with a 6-digit TOTP code or a one-time recovery code.

      The challenge token is invalidated on the first call. It is **not** a
      bearer token: presenting it in the `Authorization` header is rejected
      with `401`. Repeated wrong codes consume the challenge and are
      rate-limited per client.
    operationId: verifyTwoFactor
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/TwoFactorVerifyRequest.yaml'
    responses:
      '200':
        description: Verification successful, access token issued
        content:
          application/json:
            schema:
              $ref: '../schemas/responses/TwoFactorVerifyResponse.yaml'
      '401':
        description: Invalid or expired challenge token, or invalid code
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '429':
        description: Too many verification attempts
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
