/api/admin/plugins/upload/dry-run:
  post:
    tags:
      - PluginStore
    summary: Validate WASM plugin (dry-run)
    description: |
      Uploads a WASM plugin file, validates it, and returns plugin information
      without installing. The plugin is loaded temporarily and then unloaded.
      Admin only.
    operationId: dryRunPluginUpload
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: WASM plugin file (max 100MB)
    responses:
      '200':
        description: Plugin validation result
        content:
          application/json:
            schema:
              $ref: '../schemas/PluginDryRunResponse.yaml'
      '400':
        description: Invalid request or WASM file
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Plugin validation failed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/upload/install:
  post:
    tags:
      - PluginStore
    summary: Install WASM plugin from file
    description: |
      Uploads a WASM plugin file, saves it, and installs the plugin.
      Admin only.
    operationId: installPluginFromFile
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: WASM plugin file (max 100MB)
    responses:
      '200':
        description: Plugin installed successfully
        content:
          application/json:
            schema:
              $ref: '../schemas/PluginInstallResponse.yaml'
      '400':
        description: Invalid request or WASM file
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '409':
        description: |
          A plugin with this id is already installed. Installing never
          replaces a running plugin silently: use
          `POST /api/admin/plugins/{id}/upload` to update it from a file.
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Plugin validation failed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/loaded:
  get:
    tags:
      - PluginStore
    summary: List installed plugins
    description: |
      Returns every installed plugin merged with the runtime state of this
      panel instance: plugins that are loaded come first (in manager order),
      followed by installed plugins that are not loaded here (failed to load,
      disabled by the operator, updating). Admin only.
    operationId: listLoadedPlugins
    responses:
      '200':
        description: List of installed plugins with runtime status
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/LoadedPlugin.yaml'
                permissions_enforced:
                  type: boolean
                  description: |
                    Whether the answering panel instance applies the recorded
                    grants (`PLUGINS_PERMISSIONS_ENFORCE`). When false,
                    permissions are saved and shown but every check passes.
                  example: false
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/{id}:
  delete:
    tags:
      - PluginStore
    summary: Uninstall plugin
    description: |
      Unloads a WASM plugin, deletes its gameap-storage entries and its
      encrypted secrets, then deletes its file from the plugins directory and
      removes the plugin record and its scheduled tasks. A failure to delete
      the plugin's data aborts the uninstall before the record is removed, so
      the request can be retried. Scheduled-task cleanup is best effort: a
      failure there does not abort the uninstall — the request still completes
      with 204, and any leftover task rows are harmless (their fires are
      skipped once the plugin is gone). Admin only.
    operationId: uninstallPlugin
    parameters:
      - name: id
        in: path
        required: true
        description: Plugin ID (compact ID; database ID is decoded server-side)
        schema:
          type: string
    responses:
      '204':
        description: Plugin uninstalled (no content)
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Plugin not installed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '500':
        description: |
          Uninstall aborted: the plugin could not be unloaded, or its data,
          file or record could not be deleted. The record is kept, so the
          request can be retried.
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/{id}/reload:
  post:
    tags:
      - PluginStore
    summary: Reload plugin
    description: |
      Restarts an installed plugin on this panel instance: the running module
      is unloaded, the wasm file is loaded again and the outcome is recorded
      on the plugin (status `active`, or `error` with the reason). Pending
      automatic recovery of the plugin is cancelled. Admin only.
    operationId: reloadPlugin
    parameters:
      - name: id
        in: path
        required: true
        description: Plugin ID (compact ID; database ID is decoded server-side)
        schema:
          type: string
    responses:
      '200':
        description: Plugin reloaded
        content:
          application/json:
            schema:
              $ref: '../schemas/PluginReloadResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Plugin not installed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '409':
        description: Plugin is disabled by the operator or being updated
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: |
          Reload failed. When the plugin itself failed to load, it stays
          installed with status `error`; an operational failure (the running
          module could not be unloaded, or the plugin record could not be
          read) leaves the plugin status unchanged.
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/{id}/permissions:
  put:
    tags:
      - PluginStore
    summary: Update plugin permissions
    description: |
      Replaces the permissions an installed plugin holds. Grants are re-read
      by the host libraries on every call, so the change takes effect at once
      on every panel instance; event subscriptions are refreshed on this
      instance when `listen_events` changes. The declared permissions of the
      manifest are informational — an operator may grant more or less. Admin
      only; recorded in the audit log as `plugin.permissions.update`.
    operationId: updatePluginPermissions
    parameters:
      - name: id
        in: path
        required: true
        description: Plugin ID (compact ID; database ID is decoded server-side)
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/PluginPermissionsUpdateRequest.yaml'
    responses:
      '200':
        description: Permissions updated
        content:
          application/json:
            schema:
              $ref: '../schemas/PluginPermissionsResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Plugin not installed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Unknown permission name
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/admin/plugins/{id}/upload:
  post:
    tags:
      - PluginStore
    summary: Update installed plugin from a file
    description: |
      Replaces an installed plugin with an uploaded WASM file: the running
      module is unloaded, the plugin file is overwritten and the record is
      rewritten from the new build's manifest (name, version, description,
      author, api version, checksum), then the module is loaded again.

      The uploaded module must declare the same plugin id as `{id}`, otherwise
      the request is refused — the file is validated before anything is
      replaced.

      The plugin keeps everything an uninstall would destroy: its
      `gameap-storage` entries, its encrypted secrets, its configuration and
      its granted permissions. Grants are never widened here — a build that
      starts requiring more permissions has them recorded in
      `required_permissions`, and the calls behind them stay refused until an
      operator grants them through `PUT /api/admin/plugins/{id}/permissions`.

      A plugin installed from the store becomes a file plugin: `source` is set
      to `file://`, so the panel no longer offers store updates for it and
      other panel instances can no longer re-download its file (use
      `FILES_DRIVER=s3` for shared plugin storage). Admin only; recorded in
      the audit log as `plugin.update`.
    operationId: updatePluginFromFile
    parameters:
      - name: id
        in: path
        required: true
        description: Plugin ID (compact ID; database ID is decoded server-side)
        schema:
          type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: WASM plugin file (max 100MB)
    responses:
      '200':
        description: Plugin updated successfully
        content:
          application/json:
            schema:
              $ref: '../schemas/PluginUpdateResponse.yaml'
      '400':
        description: |
          Invalid request or WASM file, or the uploaded module declares a
          different plugin id than the one being updated
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Plugin not installed
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: |
          The plugin file was replaced and the record updated, but the new
          build failed to load; the plugin is left with status `error`
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
