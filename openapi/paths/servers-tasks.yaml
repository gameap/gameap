/api/servers/{server}/tasks:
  get:
    tags:
      - ServerTasks
    summary: List server tasks
    description: Returns scheduled tasks for a server
    operationId: listServerTasks
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    responses:
      '200':
        description: List of tasks
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/ServerTask.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  post:
    tags:
      - ServerTasks
    summary: Create server task
    description: |
      Creates a new scheduled task for a server.

      Managing the schedule (`game-server-tasks`) does not cover the command the task runs. The
      caller also needs what sending that command directly takes: `game-server-common` and
      `game-server-start`, `game-server-stop` or `game-server-restart` for the command of the
      same name, `game-server-update` for `update` and `reinstall`. A personal access token
      needs, besides `server:tasks-manage`, the ability of the command: `server:start`,
      `server:stop`, `server:restart`, or `server:update` for `update` and `reinstall`.
    operationId: createServerTask
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/CreateServerTaskRequest.yaml'
    responses:
      '201':
        description: Task created
        content:
          application/json:
            schema:
              $ref: '../schemas/ServerTask.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: >-
          The caller lacks an ability the task takes, or the server is blocked
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/servers/{server}/tasks/{id}:
  put:
    tags:
      - ServerTasks
    summary: Update server task
    description: |
      Updates a scheduled task.

      Takes the abilities of creating a task (see `POST /api/servers/{server}/tasks`), both for
      the command in the request and for the command the task has at the moment. A task whose
      command the caller may not run is refused with 403 even when the request turns it into a
      command the caller may run; deleting it takes `game-server-tasks` alone.
    operationId: updateServerTask
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/UpdateServerTaskRequest.yaml'
    responses:
      '200':
        description: Task updated
        content:
          application/json:
            schema:
              $ref: '../schemas/ServerTask.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: >-
          The caller lacks an ability the task takes, or the server is blocked
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Task not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  delete:
    tags:
      - ServerTasks
    summary: Delete server task
    description: Deletes a scheduled task
    operationId: deleteServerTask
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
    responses:
      '204':
        description: Task deleted (no content)
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Task not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/servers/{server}/tasks/{id}/executions:
  get:
    tags:
      - ServerTasks
    summary: List server task executions
    description: |
      Returns the audit log of executions for a single scheduled server task,
      ordered by `started_at` DESC. Each row is one run (success or failure).
      The list is not paginated.

      Sensitive fields `output_inline` and `output_storage_path` are returned
      only to users with the `admin roles & permissions` ability; for other
      users these fields are omitted from each item.
    operationId: listServerTaskExecutions
    parameters:
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filter by execution status
        schema:
          type: string
          enum: [running, success, failed, canceled, skipped, timed_out]
    responses:
      '200':
        description: List of executions
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/ServerTaskExecution.yaml'
      '400':
        description: Invalid server or task ID
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden — missing `gameserver.tasks` ability
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Server or task not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
