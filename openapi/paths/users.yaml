/api/users:
  get:
    tags:
      - Users
    summary: List users
    description: |
      Returns users as a **bare JSON array** (Admin only), ordered by `id`
      ascending. Optional `filter[...]` parameters narrow the result;
      `page[number]`/`page[size]` page it. Pagination is applied only when a
      `page[...]` parameter is present. Email matching is case-insensitive.
    operationId: listUsers
    parameters:
      - name: filter[id]
        in: query
        required: false
        description: Filter by user ID. Comma-separated for multiple.
        schema:
          type: string
        example: "1,2,3"
      - name: filter[login]
        in: query
        required: false
        description: Filter by exact login. Comma-separated for multiple.
        schema:
          type: string
        example: "admin,billing"
      - name: filter[email]
        in: query
        required: false
        description: >-
          Filter by email (case-insensitive). Comma-separated for multiple.
        schema:
          type: string
        example: "customer@example.com"
      - $ref: '../parameters/QueryPageNumber.yaml'
      - $ref: '../parameters/QueryPageSize.yaml'
    responses:
      '200':
        description: >-
          Array of users, ordered by id ascending. A `page[size]` above the
          maximum is clamped, not rejected.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/User.yaml'
      '400':
        description: Invalid pagination parameter (e.g. a non-numeric page[size])
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  post:
    tags:
      - Users
    summary: Create user
    description: Creates a new user (Admin only)
    operationId: createUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/CreateUserRequest.yaml'
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema:
              $ref: '../schemas/responses/UserResponse.yaml'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '409':
        description: Login or email already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Invalid role assignment
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/users/{id}:
  get:
    tags:
      - Users
    summary: Get user
    description: Returns a single user by ID (Admin only)
    operationId: getUser
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
    responses:
      '200':
        description: User details
        content:
          application/json:
            schema:
              $ref: '../schemas/User.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  put:
    tags:
      - Users
    summary: Update user
    description: Updates a user (Admin only)
    operationId: updateUser
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/UpdateUserRequest.yaml'
    responses:
      '200':
        description: User updated
        content:
          application/json:
            schema:
              $ref: '../schemas/responses/UserResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  delete:
    tags:
      - Users
    summary: Delete user
    description: Deletes a user (Admin only)
    operationId: deleteUser
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
    responses:
      '204':
        description: User deleted (no content)
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/users/{id}/servers:
  get:
    tags:
      - Users
    summary: Get user servers
    description: Returns servers assigned to a user (Admin only)
    operationId: getUserServers
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
    responses:
      '200':
        description: User servers
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/Server.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/users/{id}/servers/{server}:
  put:
    tags:
      - Users
    summary: Attach server to user
    description: |
      Assigns the server to the user, granting access to it (Admin only).
      Idempotent: attaching an already attached server succeeds and keeps
      a single assignment.
    operationId: attachUserServer
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    responses:
      '204':
        description: Server attached
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  delete:
    tags:
      - Users
    summary: Detach server from user
    description: |
      Removes the server assignment from the user (Admin only). Idempotent:
      detaching a server that is not attached succeeds, and the server
      itself is not required to exist, so stale assignments can be cleaned
      up. Per-server permissions are kept and become effective again if
      the server is re-attached.
    operationId: detachUserServer
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    responses:
      '204':
        description: Server detached
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

/api/users/{id}/servers/{server}/permissions:
  get:
    tags:
      - Users
    summary: Get user server permissions
    description: |
      Returns the user's per-server abilities (built-in plus plugin-provided)
      as an array (Admin only). Each entry has `permission` (machine name),
      `value` (granted/denied), and `name` (display label).
    operationId: getUserServerPermissions
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    responses:
      '200':
        description: User permissions
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/ServerPermission.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  put:
    tags:
      - Users
    summary: Update user server permissions
    description: |
      Updates the user's per-server abilities (Admin only). Body is a
      non-empty array of `{permission, value}` entries — granted abilities
      are added, revoked ones are removed. `value` accepts boolean,
      0/1 integers, and "true"/"false"/"0"/"1" strings.
    operationId: updateUserServerPermissions
    parameters:
      - $ref: '../parameters/PathUserId.yaml'
      - name: server
        in: path
        required: true
        description: Server ID
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                permission:
                  type: string
                  description: Ability machine name
                  example: "console"
                value:
                  oneOf:
                    - type: boolean
                    - type: string
                    - type: integer
                  description: Whether to grant the ability. Accepts true/false, "true"/"false", 0/1, "0"/"1".
              required:
                - permission
                - value
            example:
              - { permission: "console", value: true }
              - { permission: "rcon", value: false }
    responses:
      '200':
        description: Permissions updated
        content:
          application/json:
            schema:
              $ref: '../schemas/SuccessResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
