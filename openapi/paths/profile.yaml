/api/profile:
  get:
    tags:
      - Profile
    summary: Get user profile
    description: Returns the current user's profile with roles and permissions
    operationId: getProfile
    responses:
      '200':
        description: User profile
        content:
          application/json:
            schema:
              $ref: '../schemas/Profile.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'

  put:
    tags:
      - Profile
    summary: Update user profile
    description: Updates the current user's profile
    operationId: updateProfile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/requests/UpdateProfileRequest.yaml'
    responses:
      '200':
        description: Profile updated
        content:
          application/json:
            schema:
              type: object
              description: Profile update acknowledgement
              properties:
                message:
                  type: string
                  example: "Profile updated successfully"
                token:
                  type: string
                  description: >-
                    Fresh session token, present only when the password was
                    changed. Changing the password invalidates every
                    previously-issued session token (including the one that
                    made this request), so the client must replace its stored
                    token with this one to stay authenticated. Other sessions
                    stay revoked.
                  example: "v4.local.eyJhbGciOi..."
              required:
                - message
      '400':
        description: Validation error or wrong current password
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/ErrorResponse.yaml'
